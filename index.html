<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <title>Wedding Template Studio</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app" class="studio-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">W</div>
        <div>
          <strong>Wedding Template Studio</strong>
          <span>Core Engine V1</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="engine-status" class="engine-status" data-state="loading">Booting</span>
        <button class="ghost-button" type="button">Preview</button>
        <button class="primary-button" type="button" id="auto-create">Play Intro</button>
      </div>
    </header>

    <aside class="panel left-panel">
      <section>
        <div class="panel-title">Scenes</div>
        <nav id="scene-list" class="scene-list"></nav>
      </section>
      <section>
        <div class="panel-title">Library</div>
        <button class="nav-button active">Layers</button>
        <button class="nav-button">Assets</button>
        <button class="nav-button">Presets</button>
      </section>
    </aside>

    <main class="canvas-area">
      <div class="canvas-toolbar">
        <span>Live Engine Preview</span>
        <div class="device-switcher">
          <button class="device-button active" data-device="mobile">Mobile</button>
          <button class="device-button" data-device="tablet">Tablet</button>
          <button class="device-button" data-device="desktop">Desktop</button>
        </div>
      </div>

      <div class="preview-stage">
        <div id="preview-frame" class="preview-frame mobile">
          <div id="engine-root" class="engine-root" aria-live="polite">
            <div class="engine-loading">Loading scene JSON…</div>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel right-panel">
      <div class="panel-title">Properties</div>
      <div class="property-group">
        <label>Preset</label>
        <select id="preset-select">
          <option>Jawa Luxury</option>
          <option>Ocean Romantic</option>
          <option>Celestial Night</option>
        </select>
      </div>
      <div class="property-group">
        <label>Motion Level</label>
        <input type="range" min="0" max="100" value="64" />
      </div>
      <div class="property-group">
        <label>Atmosphere</label>
        <div class="chip-row">
          <button class="chip active">Glow</button>
          <button class="chip">Dust</button>
          <button class="chip">Grain</button>
        </div>
      </div>
      <div class="property-note">
        Stage #3 makes Scene JSON executable: lifecycle, event bus, state, observer, timeline, and basic renderer are now live.
      </div>
    </aside>

    <footer class="timeline-bar">
      <span>Timeline</span>
      <div class="timeline-track"><i style="width:25%"></i></div>
      <span class="checkpoint">#3 Core Engine</span>
    </footer>
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
